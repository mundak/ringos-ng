name: test-hello-world-cpp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-hello-world-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_hello_world_cpp:
    name: hello_world_cpp (${{ matrix.display_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: x64-native
            display_name: x64 native
          - lane: arm64-native
            display_name: arm64 native
          - lane: arm64-x64-emulator
            display_name: arm64 x64 emulator path

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sample test container
        run: |
          docker build -f tests/tests.Dockerfile -t ringos-sample-tests .

      - name: Run hello world C++ sample test (${{ matrix.display_name }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ringos-build"

          docker run --rm \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -v "${RUNNER_TEMP}/ringos-build:/workspace/build" \
            ringos-sample-tests \
            bash -lc "user/samples/hello_world_cpp/test-hello-world-cpp.sh ${{ matrix.lane }}"
