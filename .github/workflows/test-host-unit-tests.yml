name: test-host-unit-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-host-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_host_unit_tests:
    name: host unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sample test container
        run: |
          docker build -f tests/tests.Dockerfile -t ringos-sample-tests .

      - name: Run host unit tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ringos-build"

          docker run --rm \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -v "${RUNNER_TEMP}/ringos-build:/workspace/build" \
            ringos-sample-tests \
            bash -lc "tests/run-host-unit-tests.sh"
